[project]
name = "file-sync-pro"
version = "0.2.3a8"
description = ""
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
# license = "MIT"
# readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airmise>=3.2.3a2",
    "argsense>=1.1.3a1",
    "lk-utils>=3.8.2a2",
    "neoprint>=0.1.11",
    "requests>=2.32.5",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    "ipython>=9.17.0",
    # "qmlease[gui]>=4.0.0a5",
    "streamlit>=1.63.0",
    "streamlit-canary>=0.4.0a9",
    # "violit>=0.8.29",
]

# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

[project.urls]
homepage = "https://github.com/likianta/file-sync-pro"

[tool.hatch.build.targets.wheel]
packages = ["legacy/file_sync_pro"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pycodestyle]
max-line-length = 83

# [tool.ty.environment]
# extra-paths = ["./lib"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
# url = "http://localhost:2131/"
url = "http://47.102.108.149:2131/"
explicit = true

[tool.uv.sources]
airmise = { index = "likianta" }
argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
neoprint = { index = "likianta" }
streamlit-canary = { index = "likianta" }
